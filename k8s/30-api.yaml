apiVersion: apps/v1
kind: Deployment
metadata:
  name: evrota-api
  namespace: evrota
  labels: { app: evrota-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: evrota-api }
  template:
    metadata:
      labels: { app: evrota-api }
    spec:
      containers:
        - name: api
          image: docker.io/hafifbilgiler/evrota-backend:0.18.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://evrota-redis:6379/0
            - name: PRICES_FILE
              value: /config/prices.json
            - name: SHOP_FILE
              value: /config/shop.json
            - name: GOOGLE_PLACES_API_KEY
              valueFrom:
                secretKeyRef: { name: evrota-secrets, key: GOOGLE_PLACES_API_KEY }
            - name: EVROTA_JWT_SECRET
              valueFrom:
                secretKeyRef: { name: evrota-secrets, key: EVROTA_JWT_SECRET }
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: evrota-secrets, key: GEMINI_API_KEY, optional: true }
            - name: GOOGLE_ROUTES_API_KEY    # EVrota sunucu anahtarı (Routes + Places New)
              valueFrom:
                secretKeyRef: { name: evrota-secrets, key: GOOGLE_ROUTES_API_KEY, optional: true }
            - name: GOOGLE_WEB_CLIENT_ID     # Google ile giriş (Web OAuth istemci kimliği, gizli değil)
              value: "173551537780-em0f3ri9hl7rvrfuv1kintvkbgpfu95k.apps.googleusercontent.com"
            - name: DB_PASSWORD              # PostgreSQL (yoksa profil kapalı, API yine çalışır)
              valueFrom:
                secretKeyRef: { name: evrota-secrets, key: POSTGRES_PASSWORD, optional: true }
            - name: AGENT_DAILY_LIMIT        # AI asistan: cihaz başına günlük mesaj
              value: "30"
            - name: AGENT_PROVIDER           # "gemini" | "deepinfra" | yedekli: "gemini,deepinfra"
              value: "gemini"
            - name: GEMINI_MODEL             # asistan + araç değerlendirmesi
              value: "gemini-3.8-flash"
            - name: GEMINI_THINKING_LEVEL    # minimal | low | medium | high (düşük = ucuz, hızlı)
              value: "low"
            - name: CAMPAIGN_LIMIT           # lansman kampanyası: ilk N premium üyeye kupa (0 = kapalı)
              value: "10"
            - name: CAMPAIGN_ALLOW_TEST      # TEST İÇİN true. Yayından önce "false" yap ve campaign_entries tablosunu temizle!
              value: "true"
            - name: DEEPINFRA_MODEL
              value: "deepseek-ai/DeepSeek-V4-Flash-0731"
            - name: DEEPINFRA_API_KEY
              valueFrom:
                secretKeyRef: { name: evrota-secrets, key: DEEPINFRA_API_KEY, optional: true }
          volumeMounts:
            - name: prices
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: firebase                 # bildirimler: Firebase servis hesabı (secret yoksa bildirim kapalı)
              mountPath: /secrets/firebase
              readOnly: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: tmp
          emptyDir: {}
        - name: prices                     # /config: fiyatlar + mağaza
          projected:
            sources:
              - configMap:
                  name: evrota-prices
              - configMap:
                  name: evrota-shop
                  optional: true
        - name: firebase
          secret:
            secretName: evrota-firebase
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: evrota-api
  namespace: evrota
spec:
  selector: { app: evrota-api }
  ports:
    - name: http
      port: 8000
      targetPort: 8000
