# Bu dosyayı secret.yaml olarak kopyalayıp anahtarı yazın (secret.yaml git'e girmez):
#   cp k8s/secret.example.yaml k8s/secret.yaml && vi k8s/secret.yaml
# veya doğrudan:
#   kubectl -n evrota create secret generic evrota-secrets --from-literal=GOOGLE_PLACES_API_KEY=xxxx
apiVersion: v1
kind: Secret
metadata:
  name: evrota-secrets
  namespace: evrota
type: Opaque
stringData:
  GOOGLE_PLACES_API_KEY: "BURAYA_EVROTA_ICIN_AYRI_PLACES_ANAHTARI"
